apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-header-route
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
spec:
  parentRefs:
    - name: waypoint
      kind: Gateway
  rules:
    # Route requests with x-version: canary to v2
    - matches:
        - headers:
            - name: x-version
              value: canary
      backendRefs:
        - name: podinfo
          port: 9898
          weight: 100
    # Default: all other traffic to v1
    - backendRefs:
        - name: podinfo
          port: 9898
          weight: 100
