apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: podinfo-gateway
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
  annotations:
    # In ambient mode, the gateway is handled by waypoint proxy
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: {{ .GatewayClassName }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
