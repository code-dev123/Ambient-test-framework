apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-canary-route
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
spec:
  parentRefs:
    - name: podinfo-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podinfo
          port: 9898
          weight: {{ .StableWeight }}
        - name: podinfo-canary
          port: 9898
          weight: {{ .CanaryWeight }}
