apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-v2
  namespace: {{ .Namespace }}
  labels:
    app: podinfo
    version: v2
    test-id: {{ .TestID }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: podinfo
      version: v2
  template:
    metadata:
      labels:
        app: podinfo
        version: v2
        test-id: {{ .TestID }}
    spec:
      containers:
        - name: podinfo
          image: {{ .PodInfoImageV2 }}
          ports:
            - containerPort: 9898
              name: http
          env:
            - name: PODINFO_UI_MESSAGE
              value: "v2-canary"
