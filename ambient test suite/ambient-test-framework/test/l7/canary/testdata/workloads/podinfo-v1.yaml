apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo-v1
  namespace: {{ .Namespace }}
  labels:
    app: podinfo
    version: v1
    test-id: {{ .TestID }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
      version: v1
  template:
    metadata:
      labels:
        app: podinfo
        version: v1
        test-id: {{ .TestID }}
    spec:
      containers:
        - name: podinfo
          image: {{ .PodInfoImageV1 }}
          ports:
            - containerPort: 9898
              name: http
          env:
            - name: PODINFO_UI_MESSAGE
              value: "v1-stable"
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
spec:
  selector:
    app: podinfo
  ports:
    - port: 9898
      targetPort: 9898
      name: http
