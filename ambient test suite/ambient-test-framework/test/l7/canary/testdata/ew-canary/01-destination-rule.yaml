apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: podinfo-ew-subsets
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
spec:
  host: podinfo.{{ .Namespace }}.svc.cluster.local
  subsets:
    - name: stable
      labels:
        version: v1
    - name: canary
      labels:
        version: v2
