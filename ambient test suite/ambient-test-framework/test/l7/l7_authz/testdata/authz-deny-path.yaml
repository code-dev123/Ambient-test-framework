apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: l7-deny-admin-path
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
spec:
  targetRef:
    kind: Gateway
    name: waypoint
    group: gateway.networking.k8s.io
  action: DENY
  rules:
    - to:
        - operation:
            paths:
              - "/admin"
              - "/admin/*"
