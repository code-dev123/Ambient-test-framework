apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: {{ .Namespace }}
  labels:
    test-id: {{ .TestID }}
  annotations:
    gateway.istio.io/managed: istio.io-mesh-controller
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: Same
